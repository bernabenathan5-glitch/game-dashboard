<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dev To-Do</title>
<style>
:root{--bg:#000;--card:#0b0b0b;--line:#262626;--text:#ededed;--muted:#8a8a8a;--accent:#7f9cf5;--warn:#e8c26a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:36px 20px 80px}
h1{font-size:28px;margin:0 0 4px;overflow-wrap:anywhere}
h3{font-size:16px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.row-line{padding:6px 0;border-top:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.row-line:first-of-type{border-top:0}
.row-line .ago{color:var(--muted);white-space:nowrap}
input[type=text],select{font:inherit;font-size:15px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
button{font:inherit;font-size:15px;cursor:pointer;background:var(--accent);color:#10131a;border:0;border-radius:6px;padding:7px 14px}
button:disabled,select:disabled,input:disabled{opacity:.5;cursor:not-allowed}
button.quiet{background:none;color:var(--muted);padding:2px 6px;font-size:14px}
button.quiet:hover{color:var(--text)}
button.link{background:none;color:var(--accent);padding:0;font-size:inherit;text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:14px;max-width:380px;margin-top:22px}
.stack label{display:block;color:var(--muted);font-size:14px}
.stack input{width:100%;margin-top:4px;color:var(--text)}
.line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.line input[type=text]{flex:1;min-width:160px}
#note{margin-top:14px;padding:10px 12px;border-left:3px solid var(--warn);background:var(--card);font-size:14px}
#tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.tab{background:none;border:1px solid var(--line);color:var(--muted);padding:5px 12px;border-radius:999px;font-size:14px}
.tab.on{background:var(--text);color:#000;border-color:var(--text)}
.chip{background:none;border:1px dashed var(--line);color:var(--muted);padding:3px 10px;border-radius:999px;font-size:13px}
#count{margin-left:auto;color:var(--muted);font-size:14px}
.task{display:grid;grid-template-columns:96px 1fr 130px auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.task select{padding:4px 6px;font-size:14px}
.task select.cat{font-size:13px;color:var(--muted);max-width:130px}
.task .name{cursor:text;overflow-wrap:anywhere}
.task.done .name{color:var(--muted);text-decoration:line-through}
.task .sub{font-size:13px;color:var(--muted);margin-top:2px}
.task .sub button{font-size:13px;padding:0 4px}
.task input.edit{width:100%;min-width:0}
.empty{padding:18px 0;color:var(--muted)}
@media(max-width:720px){.cols{grid-template-columns:1fr}.task{display:flex;flex-wrap:wrap}.task>div{flex:1 1 140px}}
</style>
</head>
<body>
<main>

<div id="entry" hidden>
  <h1>Dev To-Do</h1>
  <p class="muted">A shared to-do list for a Roblox game project. Type the project name and your name. Everyone who enters the same project name sees the same list and who is doing what.</p>
  <form id="entryForm" class="stack">
    <label>Project name<input type="text" id="projIn" maxlength="60" placeholder="For example: Hyporhermonia is tuff"></label>
    <label>Your name<input type="text" id="nameIn" maxlength="30" placeholder="For example: blah blah "></label>
    <button type="submit">Open project</button>
  </form>
</div>

<div id="app" hidden>
  <h1 id="projTitle"></h1>
  <p class="muted small">You are <b id="meName"></b> · <button class="link" id="switchBtn">Switch project or name</button> · <button class="link" id="copyBtn">Copy link</button></p>
  <div id="note" hidden></div>

  <div class="cols">
    <div class="box"><h3>Working on now</h3><div id="nowList" style="margin-top:8px"></div></div>
    <div class="box"><h3>Recent activity</h3><div id="feedList" style="margin-top:8px"></div></div>
  </div>

  <div id="tabs"></div>
  <form class="line" id="tabForm">
    <input type="text" id="tabIn" maxlength="30" placeholder="New tab, like Map or Killer" aria-label="New tab name">
    <button type="submit">Add tab</button>
    <button type="button" class="quiet" id="removeBtn" hidden></button>
  </form>
  <div id="chips" class="line" style="margin-top:8px"></div>

  <form class="line" id="addForm">
    <input type="text" id="taskIn" maxlength="200" placeholder="New task" aria-label="New task">
    <select id="taskTab" aria-label="Tab"></select>
    <button type="submit" id="addBtn">Add task</button>
  </form>
  <div class="line">
    <select id="fStatus" aria-label="Show tasks"><option value="open">Open</option><option value="all">All</option><option value="todo">To do</option><option value="doing">Doing</option><option value="done">Done</option></select>
    <span id="count"></span>
  </div>
  <div id="list"></div>
</div>

</main>
<script>
const SUPABASE_URL = "https://fqvkinukxivwgzdnueni.supabase.co";
const SUPABASE_KEY = "sb_publishable_R-X3idz5BLyhm1H13n_gPw_BQTaJYsS";

const STATUS = {todo: "To do", doing: "Doing", done: "Done"};
const ACT = {todo: "moved back to To do", doing: "started", done: "finished"};
const SUGGEST = ["Map", "Killer", "Animation", "Scripting", "UI"];
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
let proj = "", key = "", me = "", cur = "all", addSel = "";
let tasks = [], tabRows = [], editing = false, loaded = false, last = "", poll = null, tick = null;

const H = {apikey: SUPABASE_KEY, "Content-Type": "application/json"};
if (!SUPABASE_KEY.startsWith("sb_")) H.Authorization = "Bearer " + SUPABASE_KEY;

async function api(table, method, query, body) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + query, {
    method, headers: Object.assign({Prefer: "return=minimal"}, H),
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return method === "GET" ? res.json() : null;
}

function setNote(t, err) { const n = $("note"); n.textContent = t; n.hidden = !t; n.dataset.err = err ? "1" : ""; }
function stamp(a) { return {updated_by: me, updated_at: new Date().toISOString(), last_action: a}; }
function ago(iso) {
  if (!iso) return "";
  const m = Math.floor(Math.max(0, Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  if (m < 1440) return Math.floor(m / 60) + " h ago";
  return Math.floor(m / 1440) + " d ago";
}
function line(box, text, when) {
  const d = document.createElement("div");
  d.className = "row-line";
  d.textContent = text;
  if (when) { const a = document.createElement("span"); a.className = "ago"; a.textContent = " · " + when; d.appendChild(a); }
  box.appendChild(d);
}
function tabNames() {
  const out = [];
  tabRows.forEach(r => { if (out.indexOf(r.name) < 0) out.push(r.name); });
  tasks.forEach(t => { if (out.indexOf(t.area) < 0) out.push(t.area); });
  return out;
}

async function load() {
  const k = key;
  try {
    const q = "&project=eq." + enc(k);
    const [t, b] = await Promise.all([
      api("tasks", "GET", "?select=*&order=created_at.asc" + q),
      api("tabs", "GET", "?select=*&order=created_at.asc" + q)
    ]);
    if (k !== key) return;
    if ($("note").dataset.err) setNote("");
    const j = JSON.stringify([t, b]);
    if (j !== last || !loaded) { last = j; tasks = t; tabRows = b; loaded = true; render(); }
  } catch (e) {
    setNote("Can’t reach the shared list right now. Make sure the database setup was run. What you see may be out of date.", true);
  }
}

async function mutate(fn) {
  try { await fn(); await load(); }
  catch (e) { setNote("That change didn’t save. Make sure the database setup was run, then try again.", true); }
}
const patch = (t, f, a) => mutate(() => api("tasks", "PATCH", "?id=eq." + t.id, Object.assign({}, f, stamp(a))));

function render() {
  if (editing) return;
  const names = tabNames();
  if (cur !== "all" && names.indexOf(cur) < 0) cur = "all";
  panels(); drawTabs(names); drawList(names);
}

function panels() {
  const now = $("nowList"), feed = $("feedList");
  now.textContent = ""; feed.textContent = "";
  const doing = tasks.filter(t => t.status === "doing");
  if (!doing.length) line(now, "Nobody has started anything yet.");
  doing.forEach(t => line(now, (t.assignee || "Someone") + ": " + t.name));
  const recent = tasks.filter(t => t.updated_by && t.updated_at).sort((a, b) => b.updated_at.localeCompare(a.updated_at)).slice(0, 8);
  if (!recent.length) line(feed, "No activity yet.");
  recent.forEach(t => line(feed, t.updated_by + " " + (t.last_action || "updated") + ": " + t.name, ago(t.updated_at)));
}

function drawTabs(names) {
  const bar = $("tabs");
  bar.textContent = "";
  const mk = (label, val) => {
    const n = tasks.filter(t => (val === "all" || t.area === val) && t.status !== "done").length;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab" + (cur === val ? " on" : "");
    b.textContent = label + " (" + n + ")";
    b.onclick = () => { cur = val; render(); };
    bar.appendChild(b);
  };
  mk("All", "all");
  names.forEach(n => mk(n, n));

  const rm = $("removeBtn");
  rm.hidden = cur === "all";
  rm.dataset.arm = "";
  rm.textContent = "Remove this tab";

  const chips = $("chips");
  chips.textContent = "";
  if (!names.length) {
    const l = document.createElement("span");
    l.className = "muted small";
    l.textContent = "Quick start:";
    chips.appendChild(l);
    SUGGEST.forEach(s => {
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip"; c.textContent = "+ " + s;
      c.onclick = () => addTab(s);
      chips.appendChild(c);
    });
  }
}

function drawList(names) {
  const sel = $("taskTab");
  sel.textContent = "";
  names.forEach(n => sel.add(new Option(n, n)));
  sel.value = cur !== "all" ? cur : (names.indexOf(addSel) >= 0 ? addSel : names[0] || "");
  sel.onchange = () => { addSel = sel.value; };
  $("taskIn").disabled = $("addBtn").disabled = sel.disabled = !names.length;

  const fs = $("fStatus").value;
  const shown = tasks.filter(t =>
    (cur === "all" || t.area === cur) &&
    (fs === "all" || (fs === "open" ? t.status !== "done" : t.status === fs)));
  const list = $("list");
  list.textContent = "";
  shown.forEach(t => list.appendChild(row(t, names)));
  if (!shown.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = !loaded ? "Loading…" : !names.length ? "Add a tab first, like Map or Killer. Then you can add tasks to it." : "No tasks here yet.";
    list.appendChild(p);
  }
  const done = tasks.filter(t => t.status === "done").length;
  $("count").textContent = loaded ? done + " of " + tasks.length + " done" : "";
}

function row(t, names) {
  const el = document.createElement("div");
  el.className = "task" + (t.status === "done" ? " done" : "");

  const st = document.createElement("select");
  st.setAttribute("aria-label", "Status: " + t.name);
  Object.keys(STATUS).forEach(k => st.add(new Option(STATUS[k], k)));
  st.value = t.status;
  st.onchange = () => {
    const s = st.value, f = {status: s};
    if (s === "doing" && !t.assignee) f.assignee = me;
    if (s === "todo") f.assignee = null;
    patch(t, f, ACT[s]);
  };

  const mid = document.createElement("div");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = t.name;
  name.onclick = () => inlineEdit(name, t.name, v => api("tasks", "PATCH", "?id=eq." + t.id, Object.assign({name: v}, stamp("renamed"))));
  const sub = document.createElement("div");
  sub.className = "sub";
  const who = t.status === "done" ? "Finished by " + (t.updated_by || "someone") : t.assignee ? t.assignee + " is on it" : "Nobody yet";
  sub.append(who + (t.updated_at ? " · " + ago(t.updated_at) : ""));
  if (t.status !== "done" && t.assignee !== me) {
    const take = document.createElement("button");
    take.className = "quiet"; take.textContent = "I’m on it";
    take.onclick = () => patch(t, {status: "doing", assignee: me}, "started");
    sub.append(" ", take);
  }
  mid.append(name, sub);

  const cat = document.createElement("select");
  cat.className = "cat";
  cat.setAttribute("aria-label", "Move to tab: " + t.name);
  names.forEach(c => cat.add(new Option(c, c)));
  cat.value = t.area;
  cat.onchange = () => patch(t, {area: cat.value}, "moved to " + cat.value);

  const del = document.createElement("button");
  del.className = "quiet"; del.textContent = "Delete";
  del.onclick = () => {
    if (del.dataset.arm) { mutate(() => api("tasks", "DELETE", "?id=eq." + t.id)); return; }
    del.dataset.arm = "1"; del.textContent = "Confirm";
    setTimeout(() => { del.dataset.arm = ""; del.textContent = "Delete"; }, 3000);
  };

  el.append(st, mid, cat, del);
  return el;
}

function inlineEdit(el, value, save) {
  editing = true;
  const inp = document.createElement("input");
  inp.type = "text"; inp.className = "edit"; inp.value = value; inp.maxLength = 200;
  el.replaceWith(inp);
  inp.focus(); inp.select();
  let done = false;
  const finish = async ok => {
    if (done) return;
    done = true; editing = false;
    const v = inp.value.trim();
    if (ok && v && v !== value) await mutate(() => save(v)); else render();
  };
  inp.onblur = () => finish(true);
  inp.onkeydown = e => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); };
}

function addTab(raw) {
  const name = raw.trim().slice(0, 30);
  if (!name) return;
  const hit = tabNames().find(n => n.toLowerCase() === name.toLowerCase());
  if (hit) { cur = hit; render(); return; }
  cur = name;
  mutate(() => api("tabs", "POST", "", {project: key, name}));
}

$("tabForm").onsubmit = e => { e.preventDefault(); addTab($("tabIn").value); $("tabIn").value = ""; };
$("addForm").onsubmit = e => {
  e.preventDefault();
  const name = $("taskIn").value.trim(), area = $("taskTab").value;
  if (!name || !area) return;
  $("taskIn").value = "";
  mutate(() => api("tasks", "POST", "", Object.assign({name, area, project: key, status: "todo"}, stamp("added"))));
};
$("removeBtn").onclick = () => {
  const b = $("removeBtn"), name = cur;
  if (!b.dataset.arm) {
    const n = tasks.filter(t => t.area === name).length;
    b.dataset.arm = "1";
    b.textContent = "Delete tab" + (n ? " and its " + n + " task" + (n > 1 ? "s" : "") : "") + "? Tap again";
    setTimeout(() => { b.dataset.arm = ""; b.textContent = "Remove this tab"; }, 4000);
    return;
  }
  cur = "all";
  mutate(async () => {
    await api("tabs", "DELETE", "?project=eq." + enc(key) + "&name=eq." + enc(name));
    await api("tasks", "DELETE", "?project=eq." + enc(key) + "&area=eq." + enc(name));
  });
};
$("fStatus").onchange = render;
$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $("copyBtn").textContent = "Copied"; }
  catch (e) { $("copyBtn").textContent = "Copy the address bar instead"; }
  setTimeout(() => { $("copyBtn").textContent = "Copy link"; }, 2000);
};
$("switchBtn").onclick = showEntry;

function showEntry() {
  clearInterval(poll); clearInterval(tick);
  $("app").hidden = true; $("entry").hidden = false;
  $("projIn").value = proj; $("nameIn").value = me;
}

function openProject() {
  key = proj.toLowerCase();
  tasks = []; tabRows = []; loaded = false; last = ""; cur = "all"; addSel = "";
  $("entry").hidden = true; $("app").hidden = false;
  $("projTitle").textContent = proj;
  $("meName").textContent = me;
  document.title = proj + " · Dev To-Do";
  setNote("");
  render();
  load();
  clearInterval(poll); clearInterval(tick);
  poll = setInterval(() => { if (!document.hidden) load(); }, 5000);
  tick = setInterval(render, 60000);
}

$("entryForm").onsubmit = e => {
  e.preventDefault();
  const p = $("projIn").value.trim(), n = $("nameIn").value.trim();
  if (!p || !n) return;
  proj = p; me = n;
  try { localStorage.setItem("who", me); localStorage.setItem("proj", proj); } catch (e) {}
  const h = "#" + enc(proj);
  if (location.hash !== h) history.replaceState(null, "", h);
  openProject();
};

function hashProject() { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ""; } }
function start() {
  let saved = {proj: "", who: ""};
  try { saved = {proj: localStorage.getItem("proj") || "", who: localStorage.getItem("who") || ""}; } catch (e) {}
  me = saved.who;
  proj = hashProject() || saved.proj;
  if (proj && me) openProject(); else showEntry();
}
window.addEventListener("hashchange", () => {
  const p = hashProject();
  if (p && p !== proj) { proj = p; if (me) openProject(); else showEntry(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("app").hidden) load(); });
start();
</script>
</body>
</html>
